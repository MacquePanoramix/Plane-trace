            var storageKey = "sky_trails_map_view";

            function saveMapView() {
                var center = map.getCenter();

                var viewState = {
                    lat: center.lat,
                    lng: center.lng,
                    zoom: map.getZoom()
                };

                localStorage.setItem(storageKey, JSON.stringify(viewState));
            }

            function restoreMapView() {
                var savedView = localStorage.getItem(storageKey);

                if (savedView) {
                    try {
                        var viewState = JSON.parse(savedView);

                        map.setView(
                            [viewState.lat, viewState.lng],
                            viewState.zoom
                        );
                    } catch (error) {
                        console.log("Could not restore saved map view:", error);
                    }
                }
            }

            restoreMapView();

            map.on("moveend", saveMapView);
            map.on("zoomend", saveMapView);

            saveMapView();
        }, 300);
    </script>
