<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Enschede Live Flight Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100%; }
        /* 自訂彈出視窗樣式 */
        .popup-info { font-size: 12px; line-height: 1.4; }
    </style>
</head>
<body>

<div id="map"></div>

<div style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 12px;">
    <b>Relative Altitude</b><br>
    <div style="height: 10px; width: 150px; background: linear-gradient(to right, #F6A97A, #B8A7E8, #6F8DEB); margin: 5px 0;"></div>
    <div style="display: flex; justify-content: space-between;"><span>Low</span><span>High</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script>
    // 初始化地圖 (以恩斯赫德為中心)
    var map = L.map('map').setView([52.22, 6.89], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 取得高度顏色 (簡單的線性映射)
    function getColor(alt) {
        if (!alt) return '#888';
        return alt < 10000 ? '#F6A97A' : (alt < 25000 ? '#B8A7E8' : '#6F8DEB');
    }

    // 讀取我們的 trail_points.json
    fetch('trail_points.json')
        .then(response => response.json())
        .then(data => {
            // 將點數據按 Aircraft 分組
            let planes = {};
            data.forEach(p => {
                if (!planes[p.address]) planes[p.address] = [];
                planes[p.address].push(p);
            });

            // 畫線
            for (let addr in planes) {
                let points = planes[addr];
                for (let i = 0; i < points.length - 1; i++) {
                    L.polyline([
                        [points[i].latitude, points[i].longitude],
                        [points[i+1].latitude, points[i+1].longitude]
                    ], {
                        color: getColor(points[i].altitude),
                        weight: 4,
                        opacity: 0.7
                    }).addTo(map).bindPopup(`
                        <div class="popup-info">
                            <b>Callsign:</b> ${points[i].callsign || 'Unknown'}<br>
                            <b>Company:</b> ${points[i].company || 'N/A'}<br>
                            <b>Altitude:</b> ${points[i].altitude || 0} ft<br>
                            <b>Speed:</b> ${points[i].speed || 0} kt<br>
                            <b>Time:</b> ${points[i].timestamp}
                        </div>
                    `);
                }
            }
        });
</script>
</body>
</html>
