<!DOCTYPE html>
<html>
<head>
    <title>Live Enschede Flight Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize the Leaflet map centered near Enschede
        var map = L.map('map').setView([52.22, 6.89], 9);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // These objects will store our active trails and markers
        var aircraftLines = {};
        var aircraftMarkers = {};

        function fetchAndUpdateMap() {
            // Fetch the latest data smoothly without reloading the HTML page
            fetch('trail_points.json?nocache=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    // Group data points by aircraft address
                    let planes = {};
                    data.forEach(point => {
                        if (!planes[point.address]) planes[point.address] = [];
                        planes[point.address].push(point);
                    });

                    // Loop through each plane to draw its trail and update its position
                    for (let address in planes) {
                        // Sort points chronologically to draw the flight path correctly
                        let points = planes[address].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                        let latlngs = points.map(p => [p.latitude, p.longitude]);
                        let latestData = points[points.length - 1];

                        // 1. Draw or Update the Trail (Polyline)
                        if (aircraftLines[address]) {
                            aircraftLines[address].setLatLngs(latlngs);
                        } else {
                            // Assign a random hex color to each new plane's trail
                            let randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                            aircraftLines[address] = L.polyline(latlngs, {color: randomColor, weight: 4}).addTo(map);
                        }
                        
                        let lastSeenTime = new Date(latestData.timestamp).toLocaleTimeString();

                        // 2. Draw or Update the Aircraft Marker and Popup
                        let popupText = `
                            <b>Company: ${latestData.company || 'Unknown Airline'}</b><br>
                            ICAO: ${latestData.address}<br>
                            Callsign: ${latestData.callsign || 'N/A'}<br>
                            Altitude: ${latestData.altitude || 'N/A'} ft<br>
                            Speed: ${latestData.speed || 'N/A'} knots<br>
                            <hr style="margin: 5px 0;">
                            Last Seen: ${lastSeenTime}
                        `;

                        if (aircraftMarkers[address]) {
                            // Move the existing marker smoothly
                            aircraftMarkers[address].setLatLng([latestData.latitude, latestData.longitude]);
                            aircraftMarkers[address].getPopup().setContent(popupText);
                        } else {
                            // Create a new marker if it just entered our radar
                            aircraftMarkers[address] = L.marker([latestData.latitude, latestData.longitude])
                                .bindPopup(popupText)
                                .addTo(map);
                        }
                    }
                })
                .catch(error => console.log("Waiting for fresh trail_points.json data..."));
        }

        // Run the update function every 5 seconds! (Goodbye page flashing)
        setInterval(fetchAndUpdateMap, 5000);
        fetchAndUpdateMap(); // Initial load
    </script>
</body>
</html>
